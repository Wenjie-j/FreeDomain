name: Arthur V4 offline migration checks

on:
  push:
    branches:
      - arthur-v4-backend-integration
      - arthur-v4-core-report
      - arthur-v4-cn-bypass-order
      - arthur-v4-image-inventory
    paths:
      - '.github/workflows/arthur-v4-static.yml'
      - 'arthur-build/v4/**'
      - 'arthur-build/ota/**'
      - 'arthur-upgrade/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and synthetic migration checks
        run: |
          sh -n arthur-build/v4/collect-current-ui.sh
          python3 arthur-build/v4/validate_firewall4_test_package.py \
            --package arthur-build/v4/package/arthur-singbox-firewall4-test \
            --candidate arthur-build/v4/sing-box-firewall4.candidate
          python3 -m unittest discover -s arthur-build/v4 -p 'test_*.py' -v
          python3 -m unittest discover -s arthur-upgrade -p 'test_*.py' -v
          python3 -m unittest discover -s arthur-build/ota -p 'test_*.py' -v
          python3 -m py_compile arthur-build/v4/verify_components.py arthur-build/v4/legacy_network_preflight.py
          node --check arthur-build/v4/luci-app-arthur-overview/htdocs/luci-static/resources/view/arthur/overview.js
          node --test arthur-build/v4/test_overview.cjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('arthur-build/v4/luci-app-arthur-overview/root/usr/share')
          for path in root.rglob('*.json'):
              json.loads(path.read_text())
          PY
