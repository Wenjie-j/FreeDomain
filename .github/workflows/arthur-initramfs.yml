name: Build Arthur NSS initramfs

on:
  push:
    branches:
      - arthur-openwrt-build-v1
    paths:
      - '.github/workflows/arthur-initramfs.yml'
      - 'arthur-build/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential clang flex bison g++ gawk gcc-multilib             gettext git libncurses-dev libssl-dev python3 python3-setuptools             rsync swig unzip zlib1g-dev file wget curl ccache jq time

      - name: Clone pinned qosmio NSS tree
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/qosmio/openwrt-ipq.git openwrt
          cd openwrt
          git checkout 92a2d104145c8d265851c4b388a41bd8e9c21cd9
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" | tee ../source-commit.txt
          git log -1 --oneline | tee -a ../source-commit.txt

      - name: Verify JDCloud target definition
        working-directory: openwrt
        run: |
          grep -n -A10 -B2 'define Device/jdcloud_re-ss-01' target/linux/qualcommax/image/ipq60xx.mk
          test -f nss-setup/config-nss.seed

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure NSS + RE-SS-01 + initramfs
        working-directory: openwrt
        run: |
          cp nss-setup/config-nss.seed .config

          ./scripts/config --disable TARGET_qualcommax_ipq807x
          ./scripts/config --enable TARGET_qualcommax
          ./scripts/config --enable TARGET_qualcommax_ipq60xx
          ./scripts/config --enable TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01

          ./scripts/config --enable TARGET_ROOTFS_INITRAMFS
          ./scripts/config --enable TARGET_INITRAMFS_COMPRESSION_ZSTD

          # Optional NSS/ath11k symbols: keep only if this pinned tree exposes them.
          ./scripts/config --enable ATH11K_MEM_PROFILE_1G || true
          ./scripts/config --enable ATH11K_NSS_SUPPORT || true

          ./scripts/config --enable PACKAGE_luci
          ./scripts/config --enable LUCI_LANG_zh_Hans
          ./scripts/config --enable PACKAGE_ethtool-full
          ./scripts/config --enable PACKAGE_iperf3

          make defconfig

          # Hard safety assertions: never accidentally build the wrong target.
          grep -q '^CONFIG_TARGET_qualcommax=y$' .config
          grep -q '^CONFIG_TARGET_qualcommax_ipq60xx=y$' .config
          grep -q '^CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y$' .config
          grep -q '^CONFIG_TARGET_ROOTFS_INITRAMFS=y$' .config

          {
            echo '===== TARGET / INITRAMFS ====='
            grep -E '^CONFIG_TARGET_qualcommax|^CONFIG_TARGET_ROOTFS_INITRAMFS|^CONFIG_TARGET_INITRAMFS' .config || true
            echo '===== NSS / ECM / ATH11K ====='
            grep -Ei 'qca.nss|nss.ecm|ath11k.*nss|ath11k.*mem.profile|sqm-scripts-nss' .config || true
            echo '===== LUCI / TEST TOOLS ====='
            grep -E '^CONFIG_PACKAGE_luci=|^CONFIG_LUCI_LANG_zh_Hans=|^CONFIG_PACKAGE_ethtool|^CONFIG_PACKAGE_iperf3=' .config || true
          } | tee ../effective-config.txt

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j"$(nproc)" V=s
          find dl -type f -size -1024c -delete || true

      - name: Build
        working-directory: openwrt
        run: |
          make -j"$(nproc)" V=s || make -j1 V=s

      - name: Collect images and metadata
        if: always()
        run: |
          mkdir -p out
          cp source-commit.txt effective-config.txt out/ 2>/dev/null || true
          cp openwrt/.config out/final.config 2>/dev/null || true

          TARGET_DIR=openwrt/bin/targets/qualcommax/ipq60xx
          if [ -d "$TARGET_DIR" ]; then
            find "$TARGET_DIR" -maxdepth 1 -type f -print | sort | tee out/target-files.txt
            find "$TARGET_DIR" -maxdepth 1 -type f \
              \( -iname '*jdcloud*re-ss-01*' -o -iname 'sha256sums' -o -iname 'profiles.json' \) \
              -exec cp -v {} out/ \;
          fi

          {
            echo '===== COLLECTED FILES ====='
            ls -lah out
            echo
            echo '===== INITRAMFS CANDIDATES ====='
            find out -maxdepth 1 -type f | grep -Ei 'initramfs|uimage|itb' || true
          } | tee out/files.txt

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arthur-nss-initramfs
          path: out/
          if-no-files-found: warn
          retention-days: 7
