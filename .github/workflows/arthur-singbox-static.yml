name: Build Arthur sing-box 1.14.1 static

on:
  push:
    branches:
      - arthur-openwrt-build-v1
    paths:
      - '.github/workflows/arthur-singbox-static.yml'
      - 'arthur-singbox/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git file binutils

      - name: Set up Go 1.25.5
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.5'
          check-latest: true

      - name: Clone sing-box 1.14.1
        run: |
          git clone --depth 1 --branch v1.14.1 https://github.com/SagerNet/sing-box.git sing-box
          cd sing-box
          git rev-parse HEAD | tee ../source-commit.txt
          go version

      - name: Build Arthur static ARM64 core
        working-directory: sing-box
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
          GOARM64: v8.0
        run: |
          set -euxo pipefail

          VERSION="1.14.1"
          TAGS="with_quic,with_dhcp,with_wireguard,with_utls,with_clash_api"
          LDFLAGS_SHARED="$(cat release/LDFLAGS)"

          go build -v -trimpath \
            -tags "$TAGS" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=$VERSION' $LDFLAGS_SHARED -s -w -buildid=" \
            -o ../sing-box-1.14.1-arthur-static \
            ./cmd/sing-box

          printf '%s\n' "$TAGS" > ../build-tags.txt

      - name: Verify static binary
        run: |
          set -euxo pipefail
          BIN=./sing-box-1.14.1-arthur-static

          test -x "$BIN"
          file "$BIN" | tee binary-file.txt
          readelf -h "$BIN" | tee elf-header.txt
          readelf -l "$BIN" | tee elf-program-headers.txt

          # A truly static/pure-Go build must not request an ELF interpreter.
          if readelf -l "$BIN" | grep -q 'INTERP'; then
            echo "ERROR: ELF contains PT_INTERP; not suitable for old QWRT"
            exit 1
          fi

          # There should be no DT_NEEDED shared-library entries.
          if readelf -d "$BIN" 2>/dev/null | grep -q 'NEEDED'; then
            echo "ERROR: ELF has shared-library dependencies"
            readelf -d "$BIN"
            exit 1
          fi

          "$BIN" version | tee version.txt
          grep -q 'sing-box version 1.14.1' version.txt
          grep -q 'CGO: disabled' version.txt

          sha256sum "$BIN" | tee SHA256SUMS
          ls -lh "$BIN" | tee size.txt

      - name: Package artifact
        run: |
          mkdir -p out
          cp sing-box-1.14.1-arthur-static out/
          cp source-commit.txt build-tags.txt binary-file.txt elf-header.txt elf-program-headers.txt version.txt SHA256SUMS size.txt out/
          cat > out/README.txt <<'EOF'
          Arthur / JDCloud RE-SS-01 sing-box test core
          Version: 1.14.1
          Target: linux/arm64, ARMv8.0 (Cortex-A53 compatible)
          CGO: disabled
          Purpose: compatibility test on old iStoreOS/QWRT before installation.
          Do NOT replace the running sing-box-anyreality yet.
          First copy this binary to /tmp, chmod +x, and run only: ./sing-box-1.14.1-arthur-static version
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arthur-singbox-1.14.1-static
          path: out/
          retention-days: 14
          if-no-files-found: error
