name: Arthur V4 pinned config preflight (no image)

on:
  push:
    branches:
      - arthur-v4-backend-integration
      - arthur-v4-core-report
    paths:
      - '.github/workflows/arthur-v4-config-preflight.yml'
      - 'arthur-build/v4/candidate.config.fragment'
      - 'arthur-build/v4/singbox-1.14.1.config.fragment'
      - 'arthur-build/v4/feeds.lock.json'
      - 'arthur-build/v4/write_pinned_feeds.py'
      - 'arthur-build/v4/prepare_v4_config_from_seed.py'
      - 'arthur-build/v4/prepare_singbox_recipe.py'
      - 'arthur-build/v4/report_core_package.py'
      - 'arthur-build/v4/core_elf.py'
      - 'arthur-build/v4/verify_components.py'
      - 'arthur-build/v4/package/sing-box/Makefile'
      - 'arthur-build/v4/package/arthur-singbox-firewall4-test/**'
      - 'arthur-build/v4/sing-box-firewall4.candidate'
      - 'arthur-build/v4/validate_firewall4_test_package.py'
      - 'arthur-build/v4/report_firewall4_test_package.py'
      - 'arthur-build/v4/report_openclash_package.py'
      - 'arthur-build/v4/prepare_openclash_core.py'
      - 'arthur-build/v4/report_openclash_core_package.py'
      - 'arthur-build/v4/package/arthur-openclash-core/**'
      - 'arthur-build/v4/luci-app-arthur-overview/**'
      - 'arthur-build/v4/report_overview_package.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenWrt configuration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl ccache jq time

      - name: Checkout pinned base and feeds
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/qosmio/openwrt-ipq.git openwrt
          git -C openwrt checkout 92a2d104145c8d265851c4b388a41bd8e9c21cd9
          python3 arthur-build/v4/write_pinned_feeds.py --output openwrt/feeds.conf
          cd openwrt
          ./scripts/feeds update -a
          # Install only V4 candidates and their recursive dependencies.
          # Installing the entire packages feed exposes unrelated Kconfig
          # cycles (e.g. squeezelite-custom) to this router build.
          ./scripts/feeds install \
            sing-box mwan3 luci luci-compat luci-app-mwan3 \
            bash curl ruby ruby-yaml unzip wget \
            kmod-qca-nss-drv kmod-qca-nss-ecm kmod-qca-nss-dp
          test -L package/feeds/packages/sing-box
          test -L package/feeds/packages/mwan3
          test -L package/feeds/luci/luci-compat
          test -L package/feeds/luci/luci-base
          test -L package/feeds/packages/unzip
          test -L package/feeds/packages/wget
          mkdir -p package/arthur
          git clone --filter=blob:none --no-checkout \
            https://github.com/jerrykuku/luci-theme-argon.git package/arthur/luci-theme-argon
          git -C package/arthur/luci-theme-argon checkout 0546f975a66796a89ff988524290c4a2e2d01855
          test -f package/arthur/luci-theme-argon/Makefile
          openclash_repo="$(jq -er '.openclash_source.repository' \
            "$GITHUB_WORKSPACE/arthur-build/v4/feeds.lock.json")"
          openclash_rev="$(jq -er '.openclash_source.revision' \
            "$GITHUB_WORKSPACE/arthur-build/v4/feeds.lock.json")"
          [[ "$openclash_repo" == 'https://github.com/vernesong/OpenClash.git' ]]
          [[ "$openclash_rev" =~ ^[0-9a-f]{40}$ ]]
          git clone --filter=blob:none --no-checkout \
            "$openclash_repo" "$RUNNER_TEMP/OpenClash"
          git -C "$RUNNER_TEMP/OpenClash" checkout "$openclash_rev"
          test "$(git -C "$RUNNER_TEMP/OpenClash" rev-parse HEAD)" = "$openclash_rev"
          test -f "$RUNNER_TEMP/OpenClash/luci-app-openclash/Makefile"
          cp -a "$RUNNER_TEMP/OpenClash/luci-app-openclash" package/arthur/
          test -f package/arthur/luci-app-openclash/Makefile
          python3 "$GITHUB_WORKSPACE/arthur-build/v4/validate_firewall4_test_package.py" \
            --package "$GITHUB_WORKSPACE/arthur-build/v4/package/arthur-singbox-firewall4-test" \
            --candidate "$GITHUB_WORKSPACE/arthur-build/v4/sing-box-firewall4.candidate"
          cp -a "$GITHUB_WORKSPACE/arthur-build/v4/package/arthur-singbox-firewall4-test" \
            package/arthur/
          cp -a "$GITHUB_WORKSPACE/arthur-build/v4/package/arthur-openclash-core" \
            package/arthur/
          cp -a "$GITHUB_WORKSPACE/arthur-build/v4/luci-app-arthur-overview" \
            package/arthur/
          test -f feeds/luci/luci.mk

      - name: Verify Sing-box source and stage the reviewed recipe
        run: |
          curl -fL --retry 2 -o "$RUNNER_TEMP/sing-box-v1.14.1.tar.gz" \
            https://codeload.github.com/SagerNet/sing-box/tar.gz/v1.14.1
          python3 arthur-build/v4/prepare_singbox_recipe.py \
            --source-archive "$RUNNER_TEMP/sing-box-v1.14.1.tar.gz" \
            --feed-makefile openwrt/feeds/packages/net/sing-box/Makefile \
            --output "$RUNNER_TEMP/verified-sing-box.Makefile"
          cmp "$RUNNER_TEMP/verified-sing-box.Makefile" \
            arthur-build/v4/package/sing-box/Makefile
          cp "$RUNNER_TEMP/verified-sing-box.Makefile" \
            openwrt/feeds/packages/net/sing-box/Makefile
          grep -q '/usr/bin/sing-box' openwrt/feeds/packages/net/sing-box/Makefile
          ! grep -q '/etc/init.d/sing-box' openwrt/feeds/packages/net/sing-box/Makefile
          ! grep -q '/etc/config/sing-box' openwrt/feeds/packages/net/sing-box/Makefile

      - name: Verify pinned upstream ARM64 OpenClash core (no execution)
        run: |
          core_url="$(jq -er '.openclash_core_source.download_url' arthur-build/v4/feeds.lock.json)"
          [[ "$core_url" == 'https://github.com/MetaCubeX/mihomo/releases/download/v1.19.31/mihomo-linux-arm64-v1.19.31.gz' ]]
          curl -fL --max-time 120 --retry 2 -o "$RUNNER_TEMP/openclash-arm64.gz" "$core_url"
          python3 arthur-build/v4/prepare_openclash_core.py \
            --archive "$RUNNER_TEMP/openclash-arm64.gz" \
            --source-lock arthur-build/v4/feeds.lock.json \
            --package-dir openwrt/package/arthur/arthur-openclash-core \
            --trace v4-openclash-core-build-trace.json

      - name: Resolve candidate packages with make defconfig
        working-directory: openwrt
        run: |
          python3 "$GITHUB_WORKSPACE/arthur-build/v4/prepare_v4_config_from_seed.py" \
            --seed nss-setup/config-nss.seed --output .config
          set -o pipefail
          make defconfig 2>&1 | tee ../v4-defconfig.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          flags = (
              'TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01',
              'TARGET_ROOTFS_INITRAMFS', 'ATH11K_MEM_PROFILE_1G',
              'NSS_FIRMWARE_VERSION_11_4', 'PACKAGE_kmod-qca-nss-drv',
              'PACKAGE_kmod-qca-nss-ecm', 'PACKAGE_luci-theme-argon',
              'PACKAGE_luci-compat', 'PACKAGE_luci-app-openclash',
              'PACKAGE_kmod-nft-tproxy',
              'PACKAGE_sing-box', 'PACKAGE_mwan3', 'PACKAGE_luci-app-mwan3',
              'PACKAGE_iptables-nft', 'PACKAGE_ip6tables-nft',
              'PACKAGE_wpad-mesh-openssl', 'SINGBOX_WITH_QUIC',
              'SINGBOX_WITH_DHCP', 'SINGBOX_WITH_WIREGUARD',
              'SINGBOX_WITH_UTLS', 'SINGBOX_WITH_CLASH_API',
          )
          config = set(Path('.config').read_text().splitlines())
          missing = [key for key in flags if f'CONFIG_{key}=y' not in config]
          module_flags = ('PACKAGE_arthur-singbox-firewall4-test',
                          'PACKAGE_arthur-openclash-core',
                          'PACKAGE_luci-app-arthur-overview')
          missing_modules = [key for key in module_flags
                             if f'CONFIG_{key}=m' not in config]
          forbidden = ('PACKAGE_iptables-zz-legacy', 'PACKAGE_ip6tables-zz-legacy')
          selected_forbidden = [key for key in forbidden
                                if f'CONFIG_{key}=y' in config or f'CONFIG_{key}=m' in config]
          recursive = 'recursive dependency detected!' in Path('../v4-defconfig.log').read_text()
          report = {
              'classification': 'CONFIG_PREFLIGHT_ONLY_NO_FIRMWARE_IMAGE',
              'requested_flags': len(flags) + len(module_flags),
              'missing_after_defconfig': missing,
              'missing_modules_after_defconfig': missing_modules,
              'selected_forbidden_legacy_firewall_packages': selected_forbidden,
              'recursive_kconfig_dependency': recursive,
              'status': 'PASS_CONFIG_ONLY' if not missing and not missing_modules
                        and not selected_forbidden and not recursive
                        else 'BLOCKED_CONFIG_DEPENDENCIES',
          }
          Path('../v4-config-preflight.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          if missing or missing_modules or selected_forbidden or recursive:
              raise SystemExit(2)
          PY

      - name: Prepare pinned LuCI translation tool before long compile
        working-directory: openwrt
        run: |
          # LuCI HostBuild installs into hostpkg, not tools' host directory.
          make -j2 package/feeds/luci/luci-base/host/compile V=s
          test -x staging_dir/hostpkg/bin/po2lmo
          export PATH="$PWD/staging_dir/hostpkg/bin:$PATH"
          command -v po2lmo
          po2lmo package/arthur/luci-app-openclash/po/zh-cn/openclash.zh-cn.po \
            "$RUNNER_TEMP/openclash.zh-cn.lmo"
          test -s "$RUNNER_TEMP/openclash.zh-cn.lmo"

      - name: Install OpenWrt host tools and target toolchain
        working-directory: openwrt
        run: |
          make -j2 tools/install V=s
          test -x staging_dir/host/bin/libdeflate-gzip
          make -j2 toolchain/install V=s

      - name: Build target kernel dependencies before package compile
        working-directory: openwrt
        run: |
          make -j2 target/linux/compile V=s
          test -n "$(find build_dir/target-*/linux-qualcommax_ipq60xx \
            -maxdepth 2 -name .config -print -quit)"

      - name: Compile Sing-box package for V4 (no image)
        working-directory: openwrt
        run: |
          make -j2 package/feeds/packages/sing-box/compile V=s
          # The ipkg-* tree is mutated after packaging with lib/apk bookkeeping.
          # Audit OpenWrt's payload-only staging tree instead.
          package_root="$(find build_dir/target-*/sing-box-full/sing-box-1.14.1 \
            -type d -path '*/.pkgdir/sing-box' -print -quit)"
          test -n "$package_root"
          test -x "$package_root/usr/bin/sing-box"
          test ! -e "$package_root/etc/init.d/sing-box"
          test ! -e "$package_root/etc/config/sing-box"
          test ! -e "$package_root/etc/sing-box/config.json"
          python3 "$GITHUB_WORKSPACE/arthur-build/v4/report_core_package.py" \
            --package-root "$package_root" \
            --apk bin/packages/aarch64_cortex-a53/packages/sing-box-1.14.1-r1.apk \
            --config .config --output-dir ..
          make -j2 package/arthur/arthur-singbox-firewall4-test/compile V=s
          firewall_root="$(find build_dir/target-* -type d \
            -path '*/arthur-singbox-firewall4-test-0.1/.pkgdir/arthur-singbox-firewall4-test' \
            -print -quit)"
          firewall_apk="$(find bin/packages \
            -name 'arthur-singbox-firewall4-test-0.1-r1.apk' -print -quit)"
          test -n "$firewall_root"
          test -n "$firewall_apk"
          test -x "$firewall_root/usr/bin/sing-box-firewall4"
          test -f "$firewall_root/usr/share/arthur-v4/firewall4-test-only"
          python3 "$GITHUB_WORKSPACE/arthur-build/v4/report_firewall4_test_package.py" \
            --package-root "$firewall_root" \
            --apk "$firewall_apk" \
            --config .config \
            --candidate "$GITHUB_WORKSPACE/arthur-build/v4/sing-box-firewall4.candidate" \
            --core-owners ../v4-core-file-owners.json \
            --output-dir ..

      - name: Compile pinned OpenClash LuCI package (no image)
        working-directory: openwrt
        run: |
          # Prepared and exercised before the long kernel/toolchain work.
          test -x staging_dir/hostpkg/bin/po2lmo
          export PATH="$PWD/staging_dir/hostpkg/bin:$PATH"
          make -j2 package/arthur/luci-app-openclash/compile V=s
          openclash_apk="$(find bin/packages -name 'luci-app-openclash-*.apk' -print -quit)"
          openclash_root="$(find build_dir/target-* -type d \
            -path '*/luci-app-openclash/.pkgdir/luci-app-openclash' -print -quit)"
          test -n "$openclash_apk"
          test -n "$openclash_root"
          python3 "$GITHUB_WORKSPACE/arthur-build/v4/report_openclash_package.py" \
            --package-root "$openclash_root" \
            --apk "$openclash_apk" \
            --config .config \
            --owners ../v4-package-file-owners.partial.json \
            --source-lock "$GITHUB_WORKSPACE/arthur-build/v4/feeds.lock.json" \
            --output-dir ..

      - name: Package verified OpenClash ARM64 core (test APK outside image)
        working-directory: openwrt
        run: |
          make -j2 package/arthur/arthur-openclash-core/compile V=s
          core_apk="$(find bin/packages -name 'arthur-openclash-core-*.apk' -print -quit)"
          core_root="$(find build_dir/target-* -type d \
            -path '*/arthur-openclash-core-1.19.31/.pkgdir/arthur-openclash-core' -print -quit)"
          test -n "$core_apk"
          test -n "$core_root"
          python3 "$GITHUB_WORKSPACE/arthur-build/v4/report_openclash_core_package.py" \
            --package-root "$core_root" --apk "$core_apk" --config .config \
            --owners ../v4-package-file-owners.partial.json \
            --trace ../v4-openclash-core-build-trace.json --output-dir ..

      - name: Compile Arthur read-only status page (test APK outside image)
        working-directory: openwrt
        run: |
          make -j2 package/arthur/luci-app-arthur-overview/compile V=s
          overview_apk="$(find bin/packages -name 'luci-app-arthur-overview-0.1-r1.apk' -print -quit)"
          overview_root="$(find build_dir/target-* -type d \
            -path '*/luci-app-arthur-overview/.pkgdir/luci-app-arthur-overview' -print -quit)"
          test -n "$overview_apk"
          test -n "$overview_root"
          node --check "$overview_root/www/luci-static/resources/view/arthur/overview.js"
          python3 "$GITHUB_WORKSPACE/arthur-build/v4/report_overview_package.py" \
            --package-root "$overview_root" --apk "$overview_apk" --config .config \
            --source "$GITHUB_WORKSPACE/arthur-build/v4/luci-app-arthur-overview" \
            --owners ../v4-package-file-owners.partial.json --output-dir ..

      - name: Upload configuration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arthur-v4-config-preflight-no-image
          path: |
            v4-config-preflight.json
            v4-core-package-build.json
            v4-core-build-trace.json
            v4-core-file-owners.json
            v4-firewall4-package-build.json
            v4-package-file-owners.partial.json
            v4-openclash-package-build.json
            v4-openclash-core-build-trace.json
            v4-openclash-core-package-build.json
            v4-overview-package-build.json
            openwrt/bin/packages/**/sing-box-1.14.1-r1.apk
            openwrt/bin/packages/**/arthur-singbox-firewall4-test-*.apk
            openwrt/bin/packages/**/luci-app-openclash-*.apk
            openwrt/bin/packages/**/luci-app-arthur-overview-0.1-r1.apk
            openwrt/.config
            openwrt/feeds.conf
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
